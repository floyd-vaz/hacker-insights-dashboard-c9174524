name: Update HN Sentiment Data

on:
  schedule:
    # Runs every 4 hours (cron uses UTC time)
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the GitHub Actions tab too

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests google-generativeai psycopg2-binary python-dotenv

      - name: Fetch new HN posts (and prune posts older than 90 days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_hn_data.py

      - name: Score new posts with Gemini
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python score_sentiment.py

      # No commit/push step needed anymore -- the workflow writes straight
      # into your live Postgres database, which your deployed API reads
      # from directly. Nothing in the repo needs to change.